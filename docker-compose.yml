services:
  catgirl:
    build: .
    image: catgirl:2.0
    container_name: catgirl
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 换 provider 即可切换服务商，密钥从同目录 .env 读
      CATGIRL_PROVIDER: ${CATGIRL_PROVIDER:-dashscope}
      CATGIRL_API_KEY: ${CATGIRL_API_KEY:-}
      CATGIRL_MODEL: ${CATGIRL_MODEL:-}
      CATGIRL_EMBED_BASE_URL: ${CATGIRL_EMBED_BASE_URL:-}
      CATGIRL_EMBED_API_KEY: ${CATGIRL_EMBED_API_KEY:-}
      CATGIRL_EMBED_MODEL: ${CATGIRL_EMBED_MODEL:-}
      # 对外接口密钥，强烈建议设置
      CATGIRL_SERVER_KEY: ${CATGIRL_SERVER_KEY:-}
      CATGIRL_DATA: /data
      CATGIRL_NAME: ${CATGIRL_NAME:-铃洛}
      CATGIRL_OWNER_QQ: ${CATGIRL_OWNER_QQ:-}
      # 语音
      CATGIRL_TTS_PROVIDER: ${CATGIRL_TTS_PROVIDER:-edge}
      CATGIRL_TTS_KEY: ${CATGIRL_TTS_KEY:-}
      CATGIRL_TTS_VOICE: ${CATGIRL_TTS_VOICE:-}
    volumes:
      - catgirl_data:/data
      # 热挂载人格文件：改完只需 docker compose restart，不用重建镜像
      - ./persona.md:/app/persona.md:ro
      - ./assets/emoji:/app/assets/emoji:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

  # QQ 适配器：独立进程，与上面的 Web 服务共用同一份记忆库
  # 不想接 QQ 就 `docker compose up -d catgirl`，别启这个
  qq:
    build: .
    image: catgirl:2.0
    container_name: catgirl-qq
    restart: unless-stopped
    command: ["python", "qq.py"]
    profiles: ["qq"]
    # 必须覆盖 Dockerfile 里的健康检查：qq.py 不开 HTTP 端口，
    # 沿用那条 8000/healthz 检查必然失败，进程明明活着也会被判 unhealthy。
    # 这里读 /proc/1/cmdline 判断主进程还在不在，只依赖 Python，
    # 不用 pgrep/ps —— slim 镜像里通常没装 procps
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'qq.py' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      CATGIRL_PROVIDER: ${CATGIRL_PROVIDER:-dashscope}
      CATGIRL_API_KEY: ${CATGIRL_API_KEY:-}
      CATGIRL_MODEL: ${CATGIRL_MODEL:-}
      CATGIRL_EMBED_BASE_URL: ${CATGIRL_EMBED_BASE_URL:-}
      CATGIRL_EMBED_API_KEY: ${CATGIRL_EMBED_API_KEY:-}
      CATGIRL_EMBED_MODEL: ${CATGIRL_EMBED_MODEL:-}
      CATGIRL_NAME: ${CATGIRL_NAME:-铃洛}
      CATGIRL_OWNER_QQ: ${CATGIRL_OWNER_QQ:-}
      CATGIRL_DATA: /data
      CATGIRL_TTS_PROVIDER: ${CATGIRL_TTS_PROVIDER:-edge}
      CATGIRL_TTS_KEY: ${CATGIRL_TTS_KEY:-}
      CATGIRL_TTS_VOICE: ${CATGIRL_TTS_VOICE:-}
      CATGIRL_QQ_ENABLED: "true"
      # 协议端地址：
      #   协议端跑在宿主机（NapCat Shell + systemd）→ ws://host.docker.internal:3001
      #   协议端跑在 Docker 里（备用方案）        → ws://napcat:3001
      CATGIRL_QQ_WS: ${CATGIRL_QQ_WS:-ws://host.docker.internal:3001}
      CATGIRL_QQ_TOKEN: ${CATGIRL_QQ_TOKEN:-}
      CATGIRL_QQ_GROUPS: ${CATGIRL_QQ_GROUPS:-}
      CATGIRL_QQ_PRIVATE: ${CATGIRL_QQ_PRIVATE:-true}
      CATGIRL_QQ_AT_ONLY: ${CATGIRL_QQ_AT_ONLY:-true}
      CATGIRL_QQ_VOICE: ${CATGIRL_QQ_VOICE:-false}
      # smart = 只在必要的时候发语音（对方点名要 / 语音对语音 / 特别开心）；always = 每条都发
      CATGIRL_QQ_VOICE_MODE: ${CATGIRL_QQ_VOICE_MODE:-smart}
      # 主动搭话：没人说话时她自己掷骰子决定要不要先开口（只对主人私聊）
      CATGIRL_QQ_SPEAK_UP: ${CATGIRL_QQ_SPEAK_UP:-false}
      CATGIRL_QQ_SPEAK_UP_CHANCE: ${CATGIRL_QQ_SPEAK_UP_CHANCE:-0.15}
      CATGIRL_QQ_SPEAK_UP_EVERY: ${CATGIRL_QQ_SPEAK_UP_EVERY:-1800}
      CATGIRL_QQ_SPEAK_UP_IDLE: ${CATGIRL_QQ_SPEAK_UP_IDLE:-3600}
      CATGIRL_QQ_SPEAK_UP_DAILY: ${CATGIRL_QQ_SPEAK_UP_DAILY:-4}
      CATGIRL_QQ_SPEAK_UP_QUIET: ${CATGIRL_QQ_SPEAK_UP_QUIET:-1-8}
      CATGIRL_QQ_SPEAK_UP_TARGET: ${CATGIRL_QQ_SPEAK_UP_TARGET:-}
      CATGIRL_QQ_MAX_CHARS: ${CATGIRL_QQ_MAX_CHARS:-400}
      # 图片识别（多模态）：留空 model 即关闭，只发「［图片］」占位符
      CATGIRL_VISION_MODEL: ${CATGIRL_VISION_MODEL:-qwen3.7-plus}
      CATGIRL_VISION_BASE_URL: ${CATGIRL_VISION_BASE_URL:-}
      CATGIRL_VISION_API_KEY: ${CATGIRL_VISION_API_KEY:-}
      # 语音识别：把 QQ 语音消息转成文字（qwen3-asr-flash，复用对话 key），留空即关闭
      CATGIRL_ASR_MODEL: ${CATGIRL_ASR_MODEL:-qwen3-asr-flash}
      CATGIRL_ASR_BASE_URL: ${CATGIRL_ASR_BASE_URL:-}
      CATGIRL_ASR_API_KEY: ${CATGIRL_ASR_API_KEY:-}
    volumes:
      - catgirl_data:/data
      # 同上，QQ 服务也要能读到最新的人格文件
      - ./persona.md:/app/persona.md:ro
      - ./assets/emoji:/app/assets/emoji:ro
    extra_hosts:
      # 协议端跑在宿主机时（NapCat Shell + systemd，推荐），
      # 用 host-gateway 把宿主机的 3001 端口映射进容器
      - "host.docker.internal:host-gateway"

  # QQ 官方机器人（推荐长期用）：走 QQ 开放平台 OpenAPI v2，腾讯认得你，不存在风控。
  # 启动：sudo docker compose --profile official up -d qqbot
  # 和上面的 qq（NapCat）是二选一，别同时开 —— 同一个群里会被回两遍。
  qqbot:
    build: .
    image: catgirl:2.0
    container_name: catgirl-qqbot
    restart: unless-stopped
    command: ["python", "qqbot.py"]
    profiles: ["official"]
    # 同 qq 服务：qqbot.py 不开 HTTP 端口，必须覆盖 Dockerfile 的 8000 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'qqbot.py' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      CATGIRL_PROVIDER: ${CATGIRL_PROVIDER:-dashscope}
      CATGIRL_API_KEY: ${CATGIRL_API_KEY:-}
      CATGIRL_MODEL: ${CATGIRL_MODEL:-}
      CATGIRL_EMBED_BASE_URL: ${CATGIRL_EMBED_BASE_URL:-}
      CATGIRL_EMBED_API_KEY: ${CATGIRL_EMBED_API_KEY:-}
      CATGIRL_EMBED_MODEL: ${CATGIRL_EMBED_MODEL:-}
      CATGIRL_NAME: ${CATGIRL_NAME:-铃洛}
      CATGIRL_DATA: /data
      CATGIRL_TTS_PROVIDER: ${CATGIRL_TTS_PROVIDER:-edge}
      CATGIRL_TTS_KEY: ${CATGIRL_TTS_KEY:-}
      CATGIRL_TTS_VOICE: ${CATGIRL_TTS_VOICE:-}
      CATGIRL_QQBOT_ENABLED: "true"
      # q.qq.com 创建机器人后拿到的 AppID 和 AppSecret
      CATGIRL_QQBOT_APP_ID: ${CATGIRL_QQBOT_APP_ID:-}
      CATGIRL_QQBOT_SECRET: ${CATGIRL_QQBOT_SECRET:-}
      # false（默认）= 正式环境 api.sgroup.qq.com，2026-03 起「扫码即建」的新流程用这个
      # true          = 沙箱 sandbox.api.sgroup.qq.com，老流程（邮箱注册 + 沙箱配置）才需要
      # 配错的表现：鉴权成功，但发消息永远没反应
      CATGIRL_QQBOT_SANDBOX: ${CATGIRL_QQBOT_SANDBOX:-false}
      # 官方给的是 openid 不是 QQ 号，第一次私聊后从日志抄进来就能被认成主人
      CATGIRL_QQBOT_OWNER_OPENID: ${CATGIRL_QQBOT_OWNER_OPENID:-}
      CATGIRL_QQBOT_RATE: ${CATGIRL_QQBOT_RATE:-1.2}
      CATGIRL_QQBOT_MAX_CHARS: ${CATGIRL_QQBOT_MAX_CHARS:-400}
      # 识图照旧可用：官方消息里的图片是 attachments 里的 URL，可以下载下来看
      CATGIRL_VISION_MODEL: ${CATGIRL_VISION_MODEL:-qwen3.7-plus}
      CATGIRL_VISION_BASE_URL: ${CATGIRL_VISION_BASE_URL:-}
      CATGIRL_VISION_API_KEY: ${CATGIRL_VISION_API_KEY:-}
    volumes:
      - catgirl_data:/data
      - ./persona.md:/app/persona.md:ro
      - ./assets/emoji:/app/assets/emoji:ro

  # 手机桥接（真机方案）：手机上跑官方 QQ 客户端 + AutoX.js 脚本（deploy/phone_autojs.js），
  # 由手机主动连过来，本服务当 WebSocket 服务端。设备指纹、客户端、网络全是「真的」，
  # 风控基本不会找上门。代价：通知里只有文字，图片/语音拿不到。
  # 启动：sudo docker compose --profile phone up -d phone
  phone:
    build: .
    image: catgirl:2.0
    container_name: catgirl-phone
    restart: unless-stopped
    command: ["python", "phone.py"]
    profiles: ["phone"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'phone.py' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      # 手机在公网/移动网络里，必须映射出去；安全组记得只放行 8765 给需要的来源
      - "${CATGIRL_PHONE_PORT:-8765}:8765"
    environment:
      CATGIRL_PROVIDER: ${CATGIRL_PROVIDER:-dashscope}
      CATGIRL_API_KEY: ${CATGIRL_API_KEY:-}
      CATGIRL_MODEL: ${CATGIRL_MODEL:-}
      CATGIRL_EMBED_BASE_URL: ${CATGIRL_EMBED_BASE_URL:-}
      CATGIRL_EMBED_API_KEY: ${CATGIRL_EMBED_API_KEY:-}
      CATGIRL_EMBED_MODEL: ${CATGIRL_EMBED_MODEL:-}
      CATGIRL_NAME: ${CATGIRL_NAME:-铃洛}
      CATGIRL_DATA: /data
      CATGIRL_TTS_PROVIDER: ${CATGIRL_TTS_PROVIDER:-edge}
      CATGIRL_TTS_KEY: ${CATGIRL_TTS_KEY:-}
      CATGIRL_TTS_VOICE: ${CATGIRL_TTS_VOICE:-}
      CATGIRL_VISION_MODEL: ${CATGIRL_VISION_MODEL:-qwen3.7-plus}
      CATGIRL_VISION_BASE_URL: ${CATGIRL_VISION_BASE_URL:-}
      CATGIRL_VISION_API_KEY: ${CATGIRL_VISION_API_KEY:-}
      CATGIRL_PHONE_ENABLED: "true"
      # 容器内必须监听 0.0.0.0，否则端口映射进来没人接
      CATGIRL_PHONE_HOST: "0.0.0.0"
      CATGIRL_PHONE_PORT: "8765"
      # 手机端脚本里的 token 必须和这里一致，否则握手直接被拒
      CATGIRL_PHONE_TOKEN: ${CATGIRL_PHONE_TOKEN:-}
      CATGIRL_PHONE_PRIVATE: ${CATGIRL_PHONE_PRIVATE:-true}
      # 群白名单写群名（通知里拿不到群号），逗号分隔，* = 所有群
      CATGIRL_PHONE_GROUPS: ${CATGIRL_PHONE_GROUPS:-}
      # 通知里没有 QQ 号，靠昵称认主人
      CATGIRL_PHONE_OWNER_NAME: ${CATGIRL_PHONE_OWNER_NAME:-}
      # true = 群里要提到她的名字才接话（通知里没有 @ 信息）
      CATGIRL_PHONE_NAME_TRIGGER: ${CATGIRL_PHONE_NAME_TRIGGER:-true}
      CATGIRL_PHONE_RATE: ${CATGIRL_PHONE_RATE:-1.5}
      CATGIRL_PHONE_MAX_CHARS: ${CATGIRL_PHONE_MAX_CHARS:-400}
    volumes:
      - catgirl_data:/data
      - ./persona.md:/app/persona.md:ro
      - ./assets/emoji:/app/assets/emoji:ro

  # QQ 协议端（Docker 版，备用方案）。
  # 默认不启用：推荐在宿主机用 NapCat Shell + systemd 跑协议端（见 06_napcat_native.sh），
  # 那个方案崩溃自动重启、日志可查、也更省内存。
  # 要用回 Docker 版：sudo docker compose --profile qq --profile napcat-docker up -d
  # （同时把 CATGIRL_QQ_WS 改回 ws://napcat:3001）
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    profiles: ["napcat-docker"]
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    ports:
      - "6099:6099"   # WebUI：扫码登录 + 配置 OneBot 服务
    volumes:
      # 必须用命名卷，不能用 ./napcat/config 这类绑定挂载：
      # 绑定挂载在宿主目录为空时会把镜像里的默认配置和 QQ 登录数据整个遮住，
      # 一旦 --force-recreate 重建容器就会掉登录，OneBot 服务也不再监听。
      # 命名卷首次创建时会自动从镜像预填充内容，之后跨容器重建持久保留。
      - napcat_config:/app/napcat/config
      - napcat_qq:/app/.config/QQ
      - catgirl_data:/data:ro   # 只读挂载，发语音时协议端要能读到音频文件
    shm_size: 256m

volumes:
  catgirl_data:
  napcat_config:
  napcat_qq:
